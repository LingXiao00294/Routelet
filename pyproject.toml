[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routelet"
version = "0.1.0"
description = "本地 LLM API 路由代理 - 虚拟模型名映射多 provider，优先级故障转移"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx[socks]>=0.28",
    "pydantic>=2",
    "structlog>=25",
    "colorama>=0.4.6; sys_platform == 'win32'",
    "aiosqlite>=0.21",
    "python-dotenv>=1.2.2",
]

[project.scripts]
routelet = "routelet.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = ["src/routelet", "dashboard/dist"]
artifacts = ["dashboard/dist/**"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"dashboard/dist" = "routelet/dashboard_dist"

[tool.hatch.build.targets.sdist]
include = [
    "/.claude",
    "/.env.example",
    "/.github",
    "/.gitignore",
    "/.python-version",
    "/AGENTS.md",
    "/README.md",
    "/dashboard",
    "/docs",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]
artifacts = ["dashboard/dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
